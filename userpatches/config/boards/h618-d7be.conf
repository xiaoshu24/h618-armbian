# Allwinner H618 quad core 4GB RAM SoC eMMC GbE HDMI, no WiFi — D7BE_H618_V1.2 TV box
# 实测硬件：H618 / 4G RAM / 128G eMMC / 千兆网口 / 无无线 / 红外 / USB-A x2 / TF
BOARD_NAME="H618 D7BE"
BOARD_VENDOR="allwinner"
BOARDFAMILY="sun50iw9"
BOARD_MAINTAINER="local"
INTRODUCED="2024"
# 内存为 Micron MT41K1G4RG-107（DDR3L-1866，x4），必须用 DDR3 时序。
# orangepi_zero3 是 LPDDR4 + AXP313，用它编出的 SPL 在本板上死在第 DRAM 初始化。
# tanix_tx6s_defconfig = H616 + DDR3-1333 + eMMC + Realtek PHY，由 Armbian 补丁引入，
# 其 DRAM 参数取自 Allwinner boot0 的机顶盒默认值（DX_ODT/TPR0/TPR10/TPR11/TPR12）。
BOOTCONFIG="tanix_tx6s_defconfig"
BOOT_FDT_FILE="allwinner/sun50i-h618-d7be.dtb"
BOOT_LOGO="desktop"
OVERLAY_PREFIX="sun50i-h616"
KERNEL_TARGET="current"
KERNEL_TEST_TARGET="current"
FORCE_BOOTSCRIPT_UPDATE="yes"
