name: build-armbian-h618

on:
  workflow_dispatch:
    inputs:
      board:
        description: 'Armbian 板型名'
        required: true
        default: 'h618-d7be'
      branch:
        description: '内核分支 current / edge'
        required: true
        default: 'current'
      release:
        description: '发行版代号'
        required: true
        default: 'bookworm'
      minimal:
        description: '最小镜像 yes / no（调试期建议 yes）'
        required: true
        default: 'yes'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 330

    steps:
      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 报告可用空间
        run: df -h /

      - name: 注册跨架构模拟（qemu binfmt）
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install all
          echo "--- 已注册的 binfmt ---"
          ls /proc/sys/fs/binfmt_misc/ || true
          echo "--- arm64 可用性 ---"
          sudo apt-get install -y --no-install-recommends arch-test >/dev/null 2>&1 || true
          arch-test arm64 && echo "arm64 OK" || echo "arm64 仍不可用"

      - name: 取回本仓库（自定义补丁）
        uses: actions/checkout@v4

      - name: 拉取 Armbian 构建框架
        run: |
          git clone --depth 1 https://github.com/armbian/build.git armbian
          if [ -d userpatches ]; then
            cp -rT userpatches armbian/userpatches
            echo "已合入 userpatches："
            find armbian/userpatches -type f | head -50
          else
            echo "本仓库无 userpatches，跳过"
          fi

      - name: 编译
        working-directory: armbian
        run: |
          ./compile.sh build \
            BOARD="${{ inputs.board }}" \
            BRANCH="${{ inputs.branch }}" \
            RELEASE="${{ inputs.release }}" \
            BUILD_MINIMAL="${{ inputs.minimal }}" \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no \
            CLEAN_LEVEL="" \
            ARTIFACT_IGNORE_CACHE=yes

      - name: 校验 dtb 是否已编译（仅自定义板型）
        if: success() && inputs.board == 'h618-d7be'
        run: |
          set -e
          echo "--- debs 目录 ---"
          ls armbian/output/debs/ | head -30 || true
          DTBPKG=$(ls armbian/output/debs/linux-dtb-*.deb 2>/dev/null | head -1 || true)
          if [ -z "$DTBPKG" ]; then
            echo "::error::没有找到 linux-dtb 包"
            exit 1
          fi
          echo "检查包: $DTBPKG"
          if dpkg-deb -c "$DTBPKG" | grep -q "sun50i-h618-d7be.dtb"; then
            echo "OK: sun50i-h618-d7be.dtb 已编译进内核包"
            dpkg-deb -c "$DTBPKG" | grep "sun50i-h618-d7be.dtb"
          else
            echo "::error::内核包里没有 sun50i-h618-d7be.dtb —— DTS 未被编译"
            echo "--- 包里现有的 h616/h618 dtb ---"
            dpkg-deb -c "$DTBPKG" | grep -E "allwinner/sun50i-h6(16|18)[^/]*\.dtb" | head -20 || true
            exit 1
          fi

      - name: 校验 u-boot 配置（DDR3 / eMMC）
        if: always()
        run: |
          echo "--- 查找 u-boot .config ---"
          CFG=$(find armbian/cache/sources -name ".config" -path "*u-boot*" 2>/dev/null | head -1)
          if [ -n "$CFG" ]; then
            echo "配置文件: $CFG"
            echo "--- 关键项 ---"
            grep -E "SUNXI_DRAM_H616|CONFIG_DRAM_CLK|CONFIG_MMC_SUNXI_SLOT_EXTRA|SUPPORT_EMMC_BOOT|DEFAULT_DEVICE_TREE|AXP305" "$CFG" || true
            if grep -q "CONFIG_SUNXI_DRAM_H616_DDR3_1333=y" "$CFG"; then
              echo "OK: u-boot 使用 DDR3-1333 时序"
            else
              echo "::error::u-boot 不是 DDR3 配置，本板会死在 DRAM 初始化"
            fi
          else
            echo "::warning::未找到 u-boot .config（可能已 clean）"
          fi
          echo "--- u-boot 二进制 ---"
          ls -lh armbian/cache/sources/u-boot-worktree/*/u-boot-sunxi-with-spl.bin 2>/dev/null || true

      - name: 汇总产物
        if: always()
        run: |
          mkdir -p out
          if [ -d armbian/output/images ]; then
            cp -v armbian/output/images/* out/ 2>/dev/null || true
          fi
          if [ -d armbian/output/debs ]; then
            mkdir -p out/debs
            cp -v armbian/output/debs/*.deb out/debs/ 2>/dev/null || true
          fi
          echo "--- 产物清单 ---"
          ls -lh out/ || true

      - name: 保留构建日志
        if: always()
        run: |
          cp -v armbian/output/logs/*.log out/ 2>/dev/null || true

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h618-${{ inputs.board }}-${{ inputs.release }}-${{ github.run_number }}
          path: out/
          retention-days: 7
          if-no-files-found: warn
